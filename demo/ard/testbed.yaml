# The multi-role testbed (evidencebook-skills#382): which roles `testbed.py up` brings up, each on its own screen.
# The four agents, the witness, the simulated rail, the catalog stand-in and the countersigner (the demo's own, run by
# the operator, so not independent of the parties).

# Each role gets one screen: a Goose window for the four that run an agent, a Terminal window for each that does not.
roles: [alder, kestrel, adjudicator, maya, witness, rail, catalog, countersigner]

# public: Action State's hosted witness, the free default every agreement names.
# local: a capsule-anchor witness started on this Mac at the release the hosted one runs (test runs, and the fallback
# when the hosted one is slow). off: no witness, nothing time-stamped (a Mac with no network).
witness: public

# fake: the simulated rail, no money moves. A rail that moves real money stays behind the RUNBOOK's real-rail steps.
rail: fake
