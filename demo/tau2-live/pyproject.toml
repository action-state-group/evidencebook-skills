[project]
name = "tau2-live-demo"
version = "0.1.0"
description = "Live tau2 airline role-play sealed on x-deal-v1 (evidencebook-skills#219)"
requires-python = ">=3.12,<3.13"  # tau2-bench imports audioop, removed in Python 3.13
dependencies = [
    # tau2-bench (MIT) supplies the airline tools and data model; pinned to the
    # public main commit checked on 2026-11-23 (the results files' own commit,
    # c30d59aa, is not on the public repository).
    "tau2 @ git+https://github.com/sierra-research/tau2-bench@768f3d8fe8528b4f32a5096f9ed008ae50f48ead",
    "mcp>=1.2,<2",
    "opentelemetry-sdk>=1.20",
    "capsule-emit[otel]>=0.18.0",
    "jevals==0.1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
