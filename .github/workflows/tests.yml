# SPDX-License-Identifier: Apache-2.0
# The scripts' tests, and the evidencebook-report skill's grades run end to end
# against a real capsulectl. Runs the pull request's own code on `pull_request`,
# which receives no secrets; nothing here needs one (no model runs: the
# end-to-end report takes the no-judge path).
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'

  admission-engine:
    # `terms test` on an admission pack, decided by a real capsule-engine build at a pinned commit.
    runs-on: ubuntu-latest
    env:
      CAPSULE_ENGINE_REF: f5a84681835498907da70615701cca7b08edd465
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/capsule-engine
          ref: ${{ env.CAPSULE_ENGINE_REF }}
          path: .deps/capsule-engine
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .deps/capsule-engine/go/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: build capsule-engine
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          (cd .deps/capsule-engine/go && go build -o "$RUNNER_TEMP/bin/capsule-engine" ./cmd/capsule-engine)
      - name: the admission sample, decided by the engine
        run: |
          CAPSULE_ENGINE="$RUNNER_TEMP/bin/capsule-engine" \
            python -m unittest tests.test_pack_schema.RealAdmissionEngine -v

  live-engine:
    # `terms test` on a live pack, decided by the Python capsule-engine installed from a pinned
    # commit (`packs evaluate` is on main, in no release yet).
    runs-on: ubuntu-latest
    env:
      CAPSULE_ENGINE_PY_REF: 05185b02f121227d1e0cd30274396f7e826ec2d4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: install capsule-engine at the pinned commit
        run: |
          python -m venv "$RUNNER_TEMP/engine"
          "$RUNNER_TEMP/engine/bin/pip" install \
            "git+https://github.com/action-state-group/capsule-engine@${CAPSULE_ENGINE_PY_REF}#subdirectory=python"
      - name: the live sample, decided by the engine
        run: |
          CAPSULE_LIVE_ENGINE="$RUNNER_TEMP/engine/bin/capsule-engine" \
            python -m unittest tests.test_pack_schema.RealLiveEngine -v

  report-grades:
    runs-on: ubuntu-latest
    env:
      # `book report build --seal` and `book report check` are on evidencebook
      # main, not yet in a capsulectl-book release. capsule-cli is the commit
      # that plugin's go.mod builds against.
      EVIDENCEBOOK_REF: 608b797ad6b9114acef72db121e4c029211c7800
      CAPSULE_CLI_REF: 759a4fb12c231e372eb285bd58f930ccc64cfee3  # v0.1.0-rc32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/evidencebook
          ref: ${{ env.EVIDENCEBOOK_REF }}
          path: .deps/evidencebook
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/capsule-cli
          ref: ${{ env.CAPSULE_CLI_REF }}
          path: .deps/capsule-cli
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .deps/evidencebook/capsulectl/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml rfc8785
      - name: build capsulectl and the capsulectl-book plugin
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/plugins"
          chmod 755 "$RUNNER_TEMP/plugins"
          (cd .deps/capsule-cli && go build -o "$RUNNER_TEMP/bin/capsulectl" ./cmd/capsulectl)
          (cd .deps/evidencebook/capsulectl && go build -o "$RUNNER_TEMP/plugins/capsulectl-book" ./cmd/capsulectl-book)
      - name: the three grades, end to end
        run: |
          CAPSULECTL="$RUNNER_TEMP/bin/capsulectl" CAPSULECTL_PLUGIN_ROOTS="$RUNNER_TEMP/plugins" \
            bash tests/fresh_env_report.sh
      - name: the inference-deals pack, sealed and checked on a payer and a provider book
        run: |
          CAPSULECTL="$RUNNER_TEMP/bin/capsulectl" CAPSULECTL_PLUGIN_ROOTS="$RUNNER_TEMP/plugins" \
            bash tests/fresh_env_deals.sh
