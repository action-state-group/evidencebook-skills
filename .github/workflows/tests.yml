# SPDX-License-Identifier: Apache-2.0
# The scripts' tests, and the evidencebook-report skill's grades run end to end
# against a real capsulectl. Runs the pull request's own code on `pull_request`,
# which receives no secrets; nothing here needs one (no model runs: the
# end-to-end report takes the no-judge path).
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      # tests/test_terms_studio.py checks the dataset `terms run` cites against AAC's own checker.
      AAC_REF: 09d2a9cb6174baa4b66ee39fda3b8b8830e244c9
      AAC_CHECKOUT: ${{ github.workspace }}/.deps/agent-action-capsule
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/agent-action-capsule
          ref: ${{ env.AAC_REF }}
          path: .deps/agent-action-capsule
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'

  ard-demo:
    # The ARD two-seller demo (demo/ard): its tests, against the pins the run sheet names: an evidencebook checkout
    # (the Goose reference's Ctl and Node) and the capsulectl-deal built from it, a capsule-engine built from a tag,
    # ledger-cloud's adjudicator built from a commit, and capsule-viewer for the pages. The end-to-end test runs both
    # deals against Action State's hosted witness (network), as a person's run does.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVIDENCEBOOK_REF: d3ad8fa2c38cdb9cded1f48f6c3051f86abf2793  # #833: the Goose reference on capsulectl-deal, x-deal-v1
      CAPSULE_ENGINE_TAG: go/v0.8.0  # the dispute rows (card.disputes_against, #280)
      LEDGER_CLOUD_REF: 9e52270669a2ef8564bcc92f8fcf9f2da2bdd11f  # the adjudicator (ledger-cloud#36, #38), run locally
      CAPSULE_VIEWER_REF: b21b993bca899fa69a4311c406ba86f442b50b2a  # ts/v0.26.1
      # ledger-cloud is a private repository: its adjudicator is built, and the end-to-end test runs, only when this
      # read token is set. Without it the job says so and runs the rest.
      LEDGER_CLOUD_READ_TOKEN: ${{ secrets.LEDGER_CLOUD_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/evidencebook
          ref: ${{ env.EVIDENCEBOOK_REF }}
          path: .deps/evidencebook
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/capsule-engine
          ref: ${{ env.CAPSULE_ENGINE_TAG }}
          path: .deps/capsule-engine
          persist-credentials: false
      - uses: actions/checkout@v4
        if: env.LEDGER_CLOUD_READ_TOKEN != ''
        with:
          repository: action-state-group/ledger-cloud
          ref: ${{ env.LEDGER_CLOUD_REF }}
          path: .deps/ledger-cloud
          token: ${{ env.LEDGER_CLOUD_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"  # the newest go.mod of the three (ledger-cloud's adjudicator)
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography pyyaml rfc8785 "mcp==2.3.0" pytest pytest-xdist "capsule-viewer @ git+https://github.com/action-state-group/capsule-viewer@${CAPSULE_VIEWER_REF}"
      - id: bins
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bin
          key: ard-bins-v3-${{ runner.os }}-${{ env.EVIDENCEBOOK_REF }}-${{ env.CAPSULE_ENGINE_TAG }}
      - name: build capsulectl-deal and capsule-engine
        if: steps.bins.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          (cd .deps/evidencebook/capsulectl && go build -o "$RUNNER_TEMP/bin/capsulectl-deal" ./cmd/capsulectl-deal)
          (cd .deps/capsule-engine/go && go build -o "$RUNNER_TEMP/bin/capsule-engine" ./cmd/capsule-engine)
      - name: build the adjudicator (ledger-cloud, private)
        if: env.LEDGER_CLOUD_READ_TOKEN != ''
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for c in adjudicator-front adjudicator-operator adjudicator-client; do
            (cd .deps/ledger-cloud/ledger_cloud/adjudicator && go build -o "$RUNNER_TEMP/bin/$c" "./cmd/$c")
          done
      - name: the demo's tests
        run: |
          ARD_EVIDENCEBOOK="$GITHUB_WORKSPACE/.deps/evidencebook" CAPSULE_ENGINE="$RUNNER_TEMP/bin/capsule-engine" \
            CAPSULECTL_DEAL="$RUNNER_TEMP/bin/capsulectl-deal" ARD_ADJUDICATOR_BIN="$RUNNER_TEMP/bin" \
            python -m pytest -q --durations=20 -n 4 --dist loadfile demo/ard/tests --ignore demo/ard/tests/test_e2e.py
      - name: no end-to-end run without ledger-cloud
        if: env.LEDGER_CLOUD_READ_TOKEN == ''
        run: echo "::warning::LEDGER_CLOUD_READ_TOKEN is not set, so the adjudicator is not built and tests/test_e2e.py does not run"
      - name: both deals end to end (Action State's hosted witness)
        if: env.LEDGER_CLOUD_READ_TOKEN != ''
        run: |
          ARD_E2E=1 ARD_EVIDENCEBOOK="$GITHUB_WORKSPACE/.deps/evidencebook" CAPSULE_ENGINE="$RUNNER_TEMP/bin/capsule-engine" \
            CAPSULECTL_DEAL="$RUNNER_TEMP/bin/capsulectl-deal" ARD_ADJUDICATOR_BIN="$RUNNER_TEMP/bin" \
            python -m pytest -v demo/ard/tests/test_e2e.py

  admission-engine:
    # `terms test` on an admission pack, decided by a real capsule-engine build at a pinned commit.
    runs-on: ubuntu-latest
    env:
      CAPSULE_ENGINE_REF: f5a84681835498907da70615701cca7b08edd465
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/capsule-engine
          ref: ${{ env.CAPSULE_ENGINE_REF }}
          path: .deps/capsule-engine
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .deps/capsule-engine/go/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: build capsule-engine
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          (cd .deps/capsule-engine/go && go build -o "$RUNNER_TEMP/bin/capsule-engine" ./cmd/capsule-engine)
      - name: the admission sample, decided by the engine
        run: |
          CAPSULE_ENGINE="$RUNNER_TEMP/bin/capsule-engine" \
            python -m unittest tests.test_pack_schema.RealAdmissionEngine -v

  live-engine:
    # `terms test` on a live pack, decided by the Python capsule-engine installed from a pinned
    # commit (`packs evaluate` is on main, in no release yet).
    runs-on: ubuntu-latest
    env:
      CAPSULE_ENGINE_PY_REF: ef03127fef07c002187bd28999a6c09bd63c3f97
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: install capsule-engine at the pinned commit
        run: |
          python -m venv "$RUNNER_TEMP/engine"
          "$RUNNER_TEMP/engine/bin/pip" install \
            "git+https://github.com/action-state-group/capsule-engine@${CAPSULE_ENGINE_PY_REF}#subdirectory=python"
      - name: the live sample, decided by the engine
        run: |
          CAPSULE_LIVE_ENGINE="$RUNNER_TEMP/engine/bin/capsule-engine" \
            python -m unittest tests.test_pack_schema.RealLiveEngine -v

  report-grades:
    runs-on: ubuntu-latest
    env:
      # `book report build --seal`, `book report check` and `--wording` are in
      # capsulectl-book v0.1.0-rc46. The page check in tests/fresh_env_deals.sh
      # needs a viewer that draws the contract report's row words, and the claim
      # member `reason` (AAC evidence-result-v0 section 4.4) needs a capsule-cli
      # whose vendored schema has it (rc48) and the viewer that draws it (go
      # v0.20.0): evidencebook#740 moved capsulectl to both. capsule-cli is the
      # release that plugin pairs with.
      EVIDENCEBOOK_REF: ffba5c6832cd6130472234b0765f20fd746a15e8  # evidencebook#740: capsule-cli rc48, capsule-viewer go v0.20.0
      CAPSULE_CLI_REF: 518d285cccf0a79c13581710ab1d9e4e3135524d  # v0.1.0-rc48
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/evidencebook
          ref: ${{ env.EVIDENCEBOOK_REF }}
          path: .deps/evidencebook
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/capsule-cli
          ref: ${{ env.CAPSULE_CLI_REF }}
          path: .deps/capsule-cli
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .deps/evidencebook/capsulectl/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml rfc8785
      - name: build capsulectl and the capsulectl-book plugin
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/plugins"
          chmod 755 "$RUNNER_TEMP/plugins"
          (cd .deps/capsule-cli && go build -o "$RUNNER_TEMP/bin/capsulectl" ./cmd/capsulectl)
          (cd .deps/evidencebook/capsulectl && go build -o "$RUNNER_TEMP/plugins/capsulectl-book" ./cmd/capsulectl-book)
      - name: the three grades, end to end
        run: |
          CAPSULECTL="$RUNNER_TEMP/bin/capsulectl" CAPSULECTL_PLUGIN_ROOTS="$RUNNER_TEMP/plugins" \
            bash tests/fresh_env_report.sh
      - name: the inference-deals pack, sealed and checked on a payer and a provider book
        run: |
          CAPSULECTL="$RUNNER_TEMP/bin/capsulectl" CAPSULECTL_PLUGIN_ROOTS="$RUNNER_TEMP/plugins" \
            bash tests/fresh_env_deals.sh

  obligations-report:
    # The eu-ai-act-obligations report path end to end (tests/fresh_env_obligations.sh):
    # tests/bookfixture seeds a closed day into a book, report.sh builds the
    # eu-ai-act-obligations-report/v2 page with the mock judge, and headless Chrome shows its
    # finding rows. Pinned to the released capsulectl and capsulectl-book the fixture's book
    # log format is written for (tests/bookfixture/go.mod holds the library versions of that
    # release).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CAPSULECTL_VERSION: v0.1.0-rc52  # capsule-cli release and evidencebook release capsulectl/v0.1.0-rc52
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/bookfixture/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch capsulectl and the capsulectl-book plugin (released binaries, checked against SHA256SUMS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$CAPSULECTL_VERSION"; P=linux-amd64
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/plugins" "$RUNNER_TEMP/dl/cli" "$RUNNER_TEMP/dl/eb"
          chmod 755 "$RUNNER_TEMP/plugins"
          gh release download "$V" -R action-state-group/capsule-cli -D "$RUNNER_TEMP/dl/cli" \
            -p SHA256SUMS -p "capsulectl-$V-$P"
          (cd "$RUNNER_TEMP/dl/cli" && grep " capsulectl-$V-$P\$" SHA256SUMS | sha256sum -c -)
          gh release download "capsulectl/$V" -R action-state-group/evidencebook -D "$RUNNER_TEMP/dl/eb" \
            -p SHA256SUMS -p "capsulectl-book-$V-$P"
          (cd "$RUNNER_TEMP/dl/eb" && grep " capsulectl-book-$V-$P\$" SHA256SUMS | sha256sum -c -)
          install -m 755 "$RUNNER_TEMP/dl/cli/capsulectl-$V-$P" "$RUNNER_TEMP/bin/capsulectl"
          install -m 755 "$RUNNER_TEMP/dl/eb/capsulectl-book-$V-$P" "$RUNNER_TEMP/plugins/capsulectl-book"
      - name: the eu-ai-act-obligations report, seeded, closed, built and drawn
        run: |
          CAPSULECTL="$RUNNER_TEMP/bin/capsulectl" CAPSULECTL_PLUGIN_ROOTS="$RUNNER_TEMP/plugins" \
            bash tests/fresh_env_obligations.sh

  tau2-live:
    # The live tau2 airline demo (demo/tau2-live): its unit tests, and a scripted case (no Goose,
    # no model: a canned two-party script and the mock judge) through the real records, tool
    # server, evaluator and report, ending in two bundles capsulectl verifies. Pinned to the
    # released binaries the demo's README installs.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CAPSULECTL_VERSION: v0.1.0-rc53  # capsule-cli release and evidencebook release capsulectl/v0.1.0-rc53
      CAPSULE_ENGINE_REF: c9e72572a020d2b22a44d20f0aad7345033598da  # go/v0.6.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/capsule-engine
          ref: ${{ env.CAPSULE_ENGINE_REF }}
          path: .deps/capsule-engine
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .deps/capsule-engine/go/go.mod
          cache: false
      - uses: astral-sh/setup-uv@v6
      - name: fetch capsulectl and its deal and book plugins (released binaries, checked against SHA256SUMS), build capsule-engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$CAPSULECTL_VERSION"; P=linux-amd64
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/plugins" "$RUNNER_TEMP/dl/cli" "$RUNNER_TEMP/dl/eb"
          chmod 755 "$RUNNER_TEMP/plugins"
          gh release download "$V" -R action-state-group/capsule-cli -D "$RUNNER_TEMP/dl/cli" \
            -p SHA256SUMS -p "capsulectl-$V-$P"
          (cd "$RUNNER_TEMP/dl/cli" && grep " capsulectl-$V-$P\$" SHA256SUMS | sha256sum -c -)
          gh release download "capsulectl/$V" -R action-state-group/evidencebook -D "$RUNNER_TEMP/dl/eb" \
            -p SHA256SUMS -p "capsulectl-deal-$V-$P" -p "capsulectl-book-$V-$P"
          (cd "$RUNNER_TEMP/dl/eb" && grep -E " capsulectl-(deal|book)-$V-$P\$" SHA256SUMS | sha256sum -c -)
          install -m 755 "$RUNNER_TEMP/dl/cli/capsulectl-$V-$P" "$RUNNER_TEMP/bin/capsulectl"
          install -m 755 "$RUNNER_TEMP/dl/eb/capsulectl-deal-$V-$P" "$RUNNER_TEMP/plugins/capsulectl-deal"
          install -m 755 "$RUNNER_TEMP/dl/eb/capsulectl-book-$V-$P" "$RUNNER_TEMP/plugins/capsulectl-book"
          (cd .deps/capsule-engine/go && go build -o "$RUNNER_TEMP/bin/capsule-engine" ./cmd/capsule-engine)
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: unit tests
        working-directory: demo/tau2-live
        run: uv run --group dev pytest -q tests
      - name: a scripted case, end to end
        working-directory: demo/tau2-live
        run: CAPSULECTL_PLUGIN_ROOTS="$RUNNER_TEMP/plugins" uv run python tests/e2e_scripted.py "$RUNNER_TEMP/tau2-live"
      - name: the range report on the ended-window fixture, through the released binaries
        working-directory: demo/tau2-live
        run: CAPSULECTL_PLUGIN_ROOTS="$RUNNER_TEMP/plugins" python3 tests/e2e_range.py "$RUNNER_TEMP/tau2-range"
