# SPDX-License-Identifier: Apache-2.0
# The scripts' tests, and the evidencebook-report skill's grades run end to end
# against a real capsulectl. Runs the pull request's own code on `pull_request`,
# which receives no secrets; nothing here needs one (no model runs: the
# end-to-end report takes the no-judge path).
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      # tests/test_terms_studio.py checks the dataset `terms run` cites against AAC's own checker.
      AAC_REF: 09d2a9cb6174baa4b66ee39fda3b8b8830e244c9
      AAC_CHECKOUT: ${{ github.workspace }}/.deps/agent-action-capsule
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/agent-action-capsule
          ref: ${{ env.AAC_REF }}
          path: .deps/agent-action-capsule
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'

  ard-demo:
    # The ARD two-seller demo (demo/ard): its tests, end to end on a simulated rail, against the
    # Goose reference and the x-deal-v0 checker in a pinned evidencebook checkout, and a
    # capsule-engine built from a pinned tag, and the capsulectl-deal binary from a pinned
    # evidencebook release for the receipt pages' verify (the run sheet's pins).
    runs-on: ubuntu-latest
    env:
      EVIDENCEBOOK_REF: 5d29ccc5240bfe1d5d8b926dd5763d5882a30ea9  # #522: #514 reverted; the demo seals no demo flag
      CAPSULE_ENGINE_TAG: go/v0.4.0
      CAPSULECTL_DEAL_TAG: capsulectl/v0.1.0-rc46  # evidencebook#610: the deal plugin moved into evidencebook
      CAPSULE_VIEWER_REF: 613a8a95144e5851bbb61df72df8cc76b7500381
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/evidencebook
          ref: ${{ env.EVIDENCEBOOK_REF }}
          path: .deps/evidencebook
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/capsule-engine
          ref: ${{ env.CAPSULE_ENGINE_TAG }}
          path: .deps/capsule-engine
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .deps/capsule-engine/go/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./.deps/evidencebook/python pyyaml rfc8785 websockets "mcp==2.3.0" pytest pytest-xdist "capsule-viewer @ git+https://github.com/action-state-group/capsule-viewer@${CAPSULE_VIEWER_REF}"
      # capsule-engine depends only on its pinned ref and the Go toolchain: build it once per pin.
      - id: bins
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bin
          key: ard-bins-${{ runner.os }}-${{ env.CAPSULE_ENGINE_TAG }}-${{ hashFiles('.deps/capsule-engine/go/go.mod') }}
      - name: build capsule-engine
        if: steps.bins.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          (cd .deps/capsule-engine/go && go build -o "$RUNNER_TEMP/bin/capsule-engine" ./cmd/capsule-engine)
      - name: fetch capsulectl-deal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$(mktemp -d)"
          gh release download "$CAPSULECTL_DEAL_TAG" -R action-state-group/evidencebook -D "$d" \
            -p SHA256SUMS -p "capsulectl-deal-${CAPSULECTL_DEAL_TAG#capsulectl/}-linux-amd64"
          (cd "$d" && grep ' capsulectl-deal-.*-linux-amd64$' SHA256SUMS | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 "$d"/capsulectl-deal-*-linux-amd64 "$RUNNER_TEMP/bin/capsulectl-deal"
      - name: the demo's tests
        run: |
          ARD_EVIDENCEBOOK="$GITHUB_WORKSPACE/.deps/evidencebook" CAPSULE_ENGINE="$RUNNER_TEMP/bin/capsule-engine" \
            CAPSULECTL_DEAL="$RUNNER_TEMP/bin/capsulectl-deal" python -m pytest -q --durations=40 -n 4 --dist loadfile demo/ard/tests

  admission-engine:
    # `terms test` on an admission pack, decided by a real capsule-engine build at a pinned commit.
    runs-on: ubuntu-latest
    env:
      CAPSULE_ENGINE_REF: f5a84681835498907da70615701cca7b08edd465
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/capsule-engine
          ref: ${{ env.CAPSULE_ENGINE_REF }}
          path: .deps/capsule-engine
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .deps/capsule-engine/go/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: build capsule-engine
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          (cd .deps/capsule-engine/go && go build -o "$RUNNER_TEMP/bin/capsule-engine" ./cmd/capsule-engine)
      - name: the admission sample, decided by the engine
        run: |
          CAPSULE_ENGINE="$RUNNER_TEMP/bin/capsule-engine" \
            python -m unittest tests.test_pack_schema.RealAdmissionEngine -v

  live-engine:
    # `terms test` on a live pack, decided by the Python capsule-engine installed from a pinned
    # commit (`packs evaluate` is on main, in no release yet).
    runs-on: ubuntu-latest
    env:
      CAPSULE_ENGINE_PY_REF: ef03127fef07c002187bd28999a6c09bd63c3f97
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: install capsule-engine at the pinned commit
        run: |
          python -m venv "$RUNNER_TEMP/engine"
          "$RUNNER_TEMP/engine/bin/pip" install \
            "git+https://github.com/action-state-group/capsule-engine@${CAPSULE_ENGINE_PY_REF}#subdirectory=python"
      - name: the live sample, decided by the engine
        run: |
          CAPSULE_LIVE_ENGINE="$RUNNER_TEMP/engine/bin/capsule-engine" \
            python -m unittest tests.test_pack_schema.RealLiveEngine -v

  report-grades:
    runs-on: ubuntu-latest
    env:
      # `book report build --seal`, `book report check` and `--wording` are in
      # capsulectl-book v0.1.0-rc46. The page check in tests/fresh_env_deals.sh
      # needs a viewer that draws the contract report's row words, and the claim
      # member `reason` (AAC evidence-result-v0 section 4.4) needs a capsule-cli
      # whose vendored schema has it (rc48) and the viewer that draws it (go
      # v0.20.0): evidencebook#740 moved capsulectl to both. capsule-cli is the
      # release that plugin pairs with.
      EVIDENCEBOOK_REF: ffba5c6832cd6130472234b0765f20fd746a15e8  # evidencebook#740: capsule-cli rc48, capsule-viewer go v0.20.0
      CAPSULE_CLI_REF: 518d285cccf0a79c13581710ab1d9e4e3135524d  # v0.1.0-rc48
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/evidencebook
          ref: ${{ env.EVIDENCEBOOK_REF }}
          path: .deps/evidencebook
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: action-state-group/capsule-cli
          ref: ${{ env.CAPSULE_CLI_REF }}
          path: .deps/capsule-cli
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .deps/evidencebook/capsulectl/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml rfc8785
      - name: build capsulectl and the capsulectl-book plugin
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/plugins"
          chmod 755 "$RUNNER_TEMP/plugins"
          (cd .deps/capsule-cli && go build -o "$RUNNER_TEMP/bin/capsulectl" ./cmd/capsulectl)
          (cd .deps/evidencebook/capsulectl && go build -o "$RUNNER_TEMP/plugins/capsulectl-book" ./cmd/capsulectl-book)
      - name: the three grades, end to end
        run: |
          CAPSULECTL="$RUNNER_TEMP/bin/capsulectl" CAPSULECTL_PLUGIN_ROOTS="$RUNNER_TEMP/plugins" \
            bash tests/fresh_env_report.sh
      - name: the inference-deals pack, sealed and checked on a payer and a provider book
        run: |
          CAPSULECTL="$RUNNER_TEMP/bin/capsulectl" CAPSULECTL_PLUGIN_ROOTS="$RUNNER_TEMP/plugins" \
            bash tests/fresh_env_deals.sh
