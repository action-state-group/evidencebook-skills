# report-spec/v1 -- mesh-llm node settlement/accounting, DRAFT.
#
# *** DRAFT, pending mesh-llm's real export format. ***
#
# This is the shape a mesh-llm settlement report would take over this engine
# -- what a node served, what it earned, what it paid for what it consumed, grouped by
# day -- NOT a working spec against real data. Every field name and the
# `record_type` value below (`mesh-settlement-exchange/v1`) is this draft's own
# placeholder, not a name Mesh has committed to for its export. Nothing in
# evidencebook-skills' tests runs this spec against a live book;
# scripts/report_spec.py's own engine (select_record_rows, the `fields:`
# projection, evaluate_group) is exercised instead with synthetic rows shaped
# like this draft's own record (tests/test_mesh_llm_draft_spec.py). It stays a
# labelled DRAFT until Mesh range bundles verify (AAC #339).
#
# Grouped by day only, never by counterparty: a per-peer summary reads like a
# reputation score of the other node, which this report does not make.
# `peer_id` stays a row field (the bilateral-seal claim reads each exchange),
# but no group, title or metric is keyed on it.
#
# Amounts are millisatoshis: Mesh settles over Lightning, in msat.
# What this draft assumes a node's own sealed exchange record carries, once
# mesh-llm has one (each exchange sealed on BOTH sides -- a node's own book
# carries its half; the counterparty's digest, when known, is the link to the
# other side's own sealed copy, the bilateral-seal the auditor/CFO relying
# party is checking for):
#
#   record_type: mesh-settlement-exchange/v1
#   peer: {id: <counterparty node id>}
#   direction: served | consumed       # this node served the peer (earned),
#                                      # or consumed the peer's service (paid)
#   amount_msat: <int>                 # earned (direction: served) or paid
#                                      # (direction: consumed), in msat
#   tokens_served: <int, present only when direction: served>
#   counterparty_seal_digest: <sha256 hex, or null if not yet linked>
#
spec_version: report-spec/v1
id: mesh-llm-settlement-draft
version: 1
title: "Mesh-llm node settlement (DRAFT)"
group_by: day

sources:
  - name: exchanges
    kind: record
    match:
      record_type: mesh-settlement-exchange/v1
    fields:
      peer_id: peer.id
      direction: direction
      amount_msat: amount_msat
      tokens_served: tokens_served
      counterparty_seal_digest: counterparty_seal_digest
      # "day" is this engine's own built-in (the day the exchange was sealed
      # on this node's book) and is the group.

metrics:
  - name: exchange_count
    source: exchanges
    op: count
  - name: tokens_served_total
    source: exchanges
    op: sum
    field: tokens_served
    where: "direction == 'served'"
  - name: earned_msat
    source: exchanges
    op: sum
    field: amount_msat
    where: "direction == 'served'"
  - name: paid_msat
    source: exchanges
    op: sum
    field: amount_msat
    where: "direction == 'consumed'"

claims:
  # The settlement-specific deterministic claim this use case needs: every
  # exchange this node sealed names the counterparty's own matching seal --
  # the bilateral link an auditor/CFO relying party checks for, computed
  # purely from the record's own counterparty_seal_digest field, no judgment.
  - id: bilateral_seal_present
    description: >-
      every settlement exchange this node sealed names the digest of the
      counterparty's own matching seal on their side of the same exchange
    kind: forall
    source: exchanges
    assert: "counterparty_seal_digest != None"

presentation:
  card: settlement
  # "\u2014" is the em dash every report title uses (result_v0.report_title),
  # escaped so this file stays ASCII under any locale.
  title_template: "{title} \u2014 {period}: {exchange_count} exchanges, {tokens_served_total}
    tokens served, {earned_msat} msat earned, {paid_msat} msat paid"
