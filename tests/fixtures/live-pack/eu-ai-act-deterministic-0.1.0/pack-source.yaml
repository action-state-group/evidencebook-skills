# SPDX-License-Identifier: Apache-2.0
# EU AI Act deterministic obligations pack -- backward-only.
#
# `outcomes[]` is the deterministic obligations pack that
# `EvidenceCompiler.compile_obligations` produces from
# `../eu-ai-act/obligations-register.yaml`, transcribed verbatim: 26 rows,
# each checked mechanically from sealed records. The 10 rows that need
# judgment, a live system-of-record read, or a reading of a contested clause
# are not here; `../eu-ai-act/obligations-pack-note.md` lists them and why.
#
# One human edit on top of the compiled rows: `tier: must_have` on the
# Article 5, 50 and 26 rows (every other row is `informational`, the
# default). `tests/test_pack_eu_ai_act_deterministic.py` recompiles the
# register and fails if any outcome differs from it in anything but `tier`.
#
# Most rows name the field they need in `evidence_instrument` and so are
# `declared_not_measured`: a plain `{"messages": [...]}` transcript corpus
# does not carry a disclosure event, an approver id or a document digest.
# Running `capsule-engine packs propose` over such a corpus reports MISSING
# INSTRUMENT on those rows, naming the field. That is the expected result.
#
# DOC rows are presence-by-digest only and never graded "compliant".
