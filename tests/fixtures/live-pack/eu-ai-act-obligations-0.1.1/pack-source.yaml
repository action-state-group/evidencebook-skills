      instrument: Regulation (EU) 2024/1689
      article: Article 53
      paragraph: "1(b)"
      jurisdiction: EU

  - id: EU-14-3
    statement: >-
      Human-oversight measures commensurate with the agent's autonomy were
      in place and operated -- not merely declared.
    evidence_rule: "RULE. every TRACE-attested execution carrying a policy binding"
    forward_verdict: DETERMINISTIC
    backward_verdict: DETERMINISTIC
    profile: obligation
    clause_ref: EU AI Act Article 14
    clause:
      instrument: Regulation (EU) 2024/1689
      article: Article 14
      paragraph: "3"
      jurisdiction: EU

  - id: EU-75
    statement: >-
      Records demanded by the AI Office were producible: complete,
      checkpointed, and verifiable offline via a transparency-log receipt.
    evidence_rule: "CONFIRM. every TRACE-attested execution of a GPAI-based or VLOP-embedded system"
    forward_verdict: DETERMINISTIC
    backward_verdict: DETERMINISTIC
    profile: obligation
