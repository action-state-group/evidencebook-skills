outcomes:
  - id: EU-53
    statement: >-
      The agent's model epoch cites the provider's downstream documentation
      (Annex XII) for the model version actually used.
    evidence_rule: "FACT. every TRACE-attested execution naming a GPAI model"
    forward_verdict: DETERMINISTIC
    backward_verdict: DETERMINISTIC
    profile: obligation
    epistemic_type: observed_event
    clause_ref: EU AI Act Article 53
