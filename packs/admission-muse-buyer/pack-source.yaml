# admission-muse-buyer@1.1 -- the Muse buyer admission pack (evidencebook-skills#154),
# in admission pack profile v0 (docs/admission-pack-profile-v0.md).
#
# A person's agent runs it in Muse before buying from a merchant. It is
# admission-baseline@1.1 with two changes, and nothing else:
#
#   1. No platform rows. Muse is no release platform, so it holds no release
#      attestation to read; the baseline's `attestation` row would read
#      not_read and the missing default would LIMIT every offer, under $1 too
#      (Sherlock2, on actionstate-muse#361). The owner-signed fact is gone with it.
#   2. The own-settled lift (profile section 4.1), Steven's ruling of
#      2026-11-17 (muse#314, What 1; narrow): the person's own settled deals
#      lift a merchant that served no card to GO, for a deal in T1 only
#      (under $10), when the book holds at least 3 settled deals, no deal with
#      the merchant is CONFLICTING and no adjudication against it fell in the
#      last 180 days. A card that was served and fails verification, or is
#      stale, still limits; above T1 every row stands as in the baseline.
#
# The count of 3 and the 180-day window are Steven's; the other numbers are the
# baseline's placeholders, except the sat ceilings below, which keep the lift under
# $10 for a Lightning deal as for a USD one (Sherlock2, on #168).
# A merchant that refuses the card ask is read as serving no card (its card
# rows read not_read), so the lift applies to it as to one that never answered.
#
# Outcomes are quoted: YAML 1.1 reads a plain NO as false.
pack_id: asg/admission_muse_buyer/1.1.0
pack_version: 1.1.0
scope:
  kind: admission
source: "evidencebook-skills#154; evidencebook-skills#51; Steven's ruling 2026-11-17 (muse#314, What 1); evidencebook-skills#280"

outcomes: ["GO", "ASK", "LIMIT", "NO"]
# A missing input limits to T0; it is never a silent GO.
missing: "LIMIT"

# The mapping table: what each accepted currency's band is counted in. No
# conversion across units: a sat band and a USD band are never compared.
accept:
  msat: {band: sat, scale: -3}
  sat: {band: sat, scale: 0}
  USD: {band: USD, scale: 0}
  USDC: {band: USD, scale: 0}
  USDT: {band: USD, scale: 0}

# A deal sits in the first tier whose ceiling for its band unit holds the
# band's decade. Above the highest tier that names its unit nothing is
# offered: a USD deal above T2, or a sat deal above T1, is LIMIT at that tier
# with source above_tier, unless a NO row or a missing input decides first or
# a row lowers the tier.
tiers:
  - id: T0                      # micro
    max_decade: {sat: 2, USD: -1}  # placeholder; sat 2 is under 1,000 sat, about $1
  - id: T1                      # small
    max_decade: {sat: 3, USD: 0}   # placeholder; sat 3 is under 10,000 sat, about $10, the bound of Steven's lift
  - id: T2                      # standard
    max_decade: {USD: 2}           # placeholder

budget:
  max_asks: 3                   # placeholder
  deadline_s: 86400             # placeholder: an unanswered ask is absence after a day

# Whose word counts: placeholders until the operator names its own.
trust_roots:
  controllers: [placeholder-controller]
  witnesses: [placeholder-witness]
  judges: [placeholder-judge]

rows:
  # T0: the operator's lists and our own adjudicated history. These are the
  # only rows that decide NO. A micro deal needs no card. No platform rows:
  # Muse is no release platform, so there is no release attestation to read.
  - id: deny-list
    statement: The counterparty is not on the operator's deny list.
    source: operator
    check: operator.not_deny_listed
    from: T0
    on_fail: "NO"
  - id: allow-list
    statement: When the operator keeps an allow list, the counterparty is on it.
    source: operator
    check: operator.allow_listed
    from: T0
    on_fail: "NO"
  - id: adverse-adjudication
    statement: No adjudication this party holds went against the counterparty in the last 180 days.
    source: own_history
    check: own.no_adverse_adjudication
    params: {window_days: 180}  # Steven's window (2026-11-17)
    from: T0
    on_fail: "NO"
  # Our own book, recorded at every tier and gating none.
  - id: own-settled
    statement: This party's own book holds at least 3 settled deals with the counterparty, which lifts a counterparty that served no card to GO for a deal up to T1.
    source: own_history
    check: own.settled
    params: {min: 3}            # Steven's count (2026-11-17)
    from: T0
    on_fail: "record"
    lift: {tier: T1, unless_fail: [adverse-adjudication, no-conflicting-deal]}
  - id: own-corroboration
    statement: This party holds the counterparty's half of an exchange.
    source: own_history
    check: own.held_halves
    params: {min: 1}            # placeholder
    from: T0
    on_fail: "record"

  # T1: the card is required, fresh and witnessed, with claims held shown
  # with their denominator and a controller declared. A missing or stale card
  # is asked for (one ask answers every row that needs it); a refused or
  # unanswered ask limits to T0, except for a merchant the own-settled lift covers
  # (own-settled below): that one is not limited by these card rows.
  - id: card-verified
    statement: The counterparty's card verifies under the key that presents it.
    source: card
    check: card.verified
    from: T1
    on_fail: "LIMIT"
    ask: {derivation: served_summary/1}
  - id: card-fresh
    statement: The card's latest checkpoint is at most 7 days old.
    source: card
    check: card.fresh
    params: {max_age_s: 604800}  # placeholder
    from: T1
    on_fail: "LIMIT"
    ask: {derivation: served_summary/1}
  - id: card-witnessed
    statement: A witness in this pack's trust roots receipted the card's latest checkpoint.
    source: card
    check: card.witnessed
    from: T1
    on_fail: "LIMIT"
  - id: claims-held
    statement: The card shows at least 10 claims held, with the claims made as the denominator.
    source: card
    check: card.claims_held
    params: {min: 10}           # placeholder
    from: T1
    on_fail: "LIMIT"
    ask: {derivation: served_summary/1}
  - id: controller-declared
    statement: The card's key declares the controller it is bound to.
    source: card
    check: card.controller_declared
    from: T1
    on_fail: "LIMIT"
  - id: no-conflicting-deal
    statement: No deal with the counterparty is CONFLICTING in this party's own book.
    source: own_history
    check: own.no_conflicting
    from: T1
    on_fail: "LIMIT"

  # Disputes about the counterparty with anyone, as its card shows (#280,
  # Steven's ruling; profile section 3.3). A dispute decided against it limits;
  # a verified card with no dispute tally is recorded and does not limit,
  # Sherlock2's interim until the card asked for at T1 carries the tally
  # (#281). Open disputes are recorded only: anyone can open one.
  - id: disputes-against
    statement: The counterparty's card shows no dispute about it decided against it, out of the disputes decided.
    source: card
    check: card.disputes_against
    params: {max: 0}              # placeholder; LIMIT on any loss is Sherlock2's default
    from: T1
    on_fail: "LIMIT"
    on_unread: "record"
  - id: open-disputes
    statement: The counterparty's card shows how many disputes about it are still open, out of all it received.
    source: card
    check: card.open_disputes
    params: {max: 0}              # placeholder
    from: T1
    on_fail: "record"

  # T2: a selection bound to our ask, with inclusion proofs; the controller in
  # our trust roots; no dispute left unanswered with anyone in 90 days.
  - id: selection
    statement: A selection the counterparty returned to this party's own ask verifies, inclusion proofs included.
    source: bound
    check: bound.selection_verified
    from: T2
    on_fail: "LIMIT"
    ask: {derivation: selection}
  - id: controller-trusted
    statement: The controller the card declares is in this pack's trust roots.
    source: card
    check: card.controller_trusted
    from: T2
    on_fail: "LIMIT"
  - id: no-unanswered-dispute
    statement: The selection shows no dispute with anyone left unanswered in the last 90 days.
    source: bound
    check: bound.no_unanswered_dispute
    params: {window_days: 90}   # placeholder
    from: T2
    on_fail: "LIMIT"
  - id: independence
    statement: Vouches from distinct controllers, not the counterparty's own, are counted.
    source: vouch
    check: vouch.distinct_controllers
    params: {min: 3}            # placeholder
    from: T2
    on_fail: "record"
  - id: adjacent-domain
    statement: The disclosed history is from the same kind of work as the proposed deal.
    source: judged
    check: judged
    from: T2
    on_fail: {cap: T1}
  # Stake is a row source only: recorded, deciding nothing, with no bond terms.
  - id: stake
    statement: Collateral posted on this deal covers its amount in the deal's band unit.
    source: stake
    check: stake.covers_deal
    from: T2
    on_fail: "record"
